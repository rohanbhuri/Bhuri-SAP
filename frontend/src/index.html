<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title id="app-title">SchoolOS Management System</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="SchoolOS Resource Management Platform" />
  <meta name="keywords" content="business management, resource management, HR, CRM, project management, inventory" />
  <meta name="author" content="Rohan Bhuri" />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#6B46C1" />
  <meta name="color-scheme" content="light dark" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <!-- Performance hints -->
  <link rel="dns-prefetch" href="//fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="SchoolOS Management System" />
  <meta property="og:description" content="SchoolOS Resource Management Platform" />
  <meta property="og:site_name" content="SchoolOS" />
  <meta property="og:url" content="http://localhost:4203" />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="SchoolOS Management System" />
  <meta name="twitter:description" content="SchoolOS Resource Management Platform" />
  <meta name="twitter:site" content="@SchoolOS" />

  <!-- Icons -->
  <link rel="icon" type="image/x-icon" href="favicon.ico" id="app-favicon" />
  <link rel="apple-touch-icon" sizes="180x180" href="/config/assets/schoolos/icons/schoolos-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/config/assets/schoolos/icons/schoolos-icon.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/config/assets/schoolos/icons/schoolos-icon.png" />

  <link rel="canonical" href="http://localhost:4203" />
  <link rel="manifest" href="/manifest.json" />

  <!-- Optimized font loading -->
  <link rel="preload" href="https://fonts.googleapis.com/icon?family=Material+Icons&display=swap" as="style"
    onload="this.onload=null;this.rel='stylesheet'" />
  <noscript>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons&display=swap" rel="stylesheet" />
  </noscript>

  <!-- Material theme loaded dynamically -->
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/@angular/material@20/prebuilt-themes/indigo-pink.css"
    as="style" onload="this.onload=null;this.rel='stylesheet'" />
  <noscript>
    <link href="https://cdn.jsdelivr.net/npm/@angular/material@20/prebuilt-themes/indigo-pink.css" rel="stylesheet" />
  </noscript>
  <!-- Critical CSS inlined -->
  <style>
    :root {
      --primary-color: #6B46C1;
      --accent-color: #9F7AEA;
      --secondary-color: #553C9A;
    }

    body {
      margin: 0;
      font-family: Roboto, sans-serif;
      background: var(--primary-color);
    }

    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
    }

    .skip-link {
      position: absolute;
      left: -9999px;
    }

    .skip-link:focus {
      left: 16px;
      top: 16px;
      z-index: 10000;
      padding: 8px 12px;
      background: var(--primary-color);
      color: white;
    }
  </style>
  <!-- Model Viewer for 3D -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>

  <script>
    // Load brand configuration from environment
    window.brandConfig = {
      brand: {
        name: "SchoolOS",
        logo: "/config/assets/schoolos/icons/schoolos-logo.png",
        logoDark: "/config/assets/schoolos/icons/schoolos-logo-dark.png",
        icon: "/config/assets/schoolos/icons/schoolos-icon.png",
      },
      colors: {
        primary: "#6B46C1",
        accent: "#9F7AEA",
        secondary: "#553C9A",
      },
      app: {
        name: "SchoolOS Management System",
        version: "1.0.0",
        description: "SchoolOS Resource Management Platform",
        port: parseInt("4203"),
        apiUrl: "http://localhost:3003/api",
      },
    };

    // Update title and favicon
    document.getElementById("app-title").textContent = window.brandConfig.app.name;
    document.getElementById("app-favicon").href = window.brandConfig.brand.icon;

    // Register service worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(registration => console.log('SW registered:', registration))
          .catch(registrationError => console.log('SW registration failed:', registrationError));
      });
    }
  </script>
</head>

<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <app-root></app-root>
</body>

</html>
