# HTTPS for xrm.racconti.in (managed by Certbot)
server {
    listen 443 ssl;
    server_name xrm.racconti.in;
    client_max_body_size 25M;

    ssl_certificate /etc/letsencrypt/live/xrm.racconti.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xrm.racconti.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

